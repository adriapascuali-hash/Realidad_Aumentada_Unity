<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Permite que, si el usuario añade la web a la pantalla de inicio, se abra
         sin barra de direcciones ni barra de navegación NI ningún icono/overlay
         del navegador (Android e iOS) — es la única forma real de conseguir eso,
         la Fullscreen API no sirve porque los navegadores bloquean a propósito
         cualquier intento de la página de tocar su icono nativo de salir de
         pantalla completa. El manifest es lo que usa Chrome/Android para el modo
         standalone; las meta apple-* son el equivalente para iOS Safari. -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#07080f">
    <title>Drone Control Station</title>
    <!-- Librerías servidas desde el propio Flask (antes venían de cdnjs y
         jsDelivr) para que la app funcione en una red local sin Internet.
         Mismas versiones que en el CDN: Socket.IO 4.0.1 y nipplejs 0.9.0. -->
    <script src="/static/js/vendor/socket.io.js"></script>
    <script src="/static/js/vendor/nipplejs.min.js"></script>
    <style>
        /* ── Reset & Base ──────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #07080f;
            --surface:  #0e1020;
            --surface2: #141728;
            --border:   #1e2540;
            --cyan:     #00d4ff;
            --cyan-dim: #006680;
            --green:    #00ff88;
            --red:      #ff3a5c;
            --yellow:   #ffc800;
            --text:     #cdd6f4;
            --text-dim: #6c7086;
            --radius:   10px;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            width: 100vw;
            touch-action: manipulation;
            overscroll-behavior: none; /* sin rebote elástico al arrastrar */
            /* El body se hace 1px más alto que la ventana a propósito (ver
               min-height más abajo) para poder plegar la barra de
               direcciones en móvil vía scrollTo(0,1) en main.js. En móvil
               las scrollbars son overlay y no se nota; en escritorio ese
               1px de overflow vertical dispara la scrollbar vertical, que a
               su vez hace que el 100vw de arriba se pase del ancho visible
               y dispare también la horizontal. overflow:hidden la oculta
               sin afectar al scrollTo programático (todo el contenido va
               con position:fixed, no depende del flujo normal). */
            overflow: hidden;
        }
        html {
            height: 100dvh;
        }
        body {
            /* Un poco más alta que la ventana a propósito: da un margen de scroll
               de 1px que solo se usa para plegar la barra de direcciones del
               navegador nada más entrar (ver window.scrollTo en main.js). Nunca se
               nota: todo el contenido va con position:fixed, no depende del flujo
               normal del documento. No sustituye a "Añadir a pantalla de inicio" —
               eso es lo único que garantiza cero interfaz del navegador; esto es
               solo un empujón de mejor esfuerzo que algunos navegadores respetan.  */
            min-height: calc(100dvh + 1px);
        }

        /* ── Video Panel (fullscreen) ─────────────────────────────────────── */
        .video-panel {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .no-signal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-dim);
        }

        .no-signal-icon {
            width: 64px;
            height: 64px;
            opacity: 0.3;
        }

        .no-signal p {
            font-size: 13px;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        /* ── Side drawer (controles) ──────────────────────────────────────── */
        .drawer-toggle-btn {
            position: absolute;
            /* Más abajo que el borde superior: ahí es donde el propio navegador
               suele dibujar su icono/flecha de "salir de pantalla completa"
               cuando la web está en fullscreen, y tapaba este botón. */
            top: 48px;
            left: 12px;
            z-index: 80;
            width: auto;
            height: auto;
            padding: 7px 9px;
            border-radius: 5px;
            background: rgba(0,0,0,0.55);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 20px;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            letter-spacing: 0;
        }
        .drawer-toggle-btn:hover { background: rgba(0,0,0,0.75); }

        /* Mismo estilo que el botón de menú, pero anclado a la derecha. */
        .fullscreen-toggle-btn {
            left: auto;
            right: 12px;
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 90;
        }
        .drawer-overlay.hidden { display: none; }

        .side-drawer {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px;
            max-width: 85vw;
            background: linear-gradient(
                160deg,
                #0c1828 0%,
                #0a1220 40%,
                #07090f 100%
            );

            border-right: 1px solid #1e4d6b;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            overflow-y: auto;
        }
        .side-drawer.open { transform: translateX(0); }

        .side-drawer::-webkit-scrollbar { display: none; }
        .side-drawer { scrollbar-width: none; }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--cyan);
        }

        .drawer-close-btn {
            position: absolute;
            right: 0;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 16px;
            padding: 2px 6px;
        }
        .drawer-close-btn:hover { color: var(--text); }

        .drawer-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .drawer-divider {
            height: 1px;
            background: #1e2d4a;
            border: none;
            margin: 4px 0;
            flex-shrink: 0;
        }

        .drawer-toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
        }
        .drawer-toggle-row input { width: 16px; height: 16px; cursor: pointer; }

        .drawer-btn { width: 100%; font-size: 11px; padding: 6px 10px; }

        .altitude-control {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            font-size: 12px;
        }

        .altitude-control input {
            width: 64px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            padding: 6px 8px;
            outline: none;
        }
        .altitude-control input:focus { border-color: var(--cyan-dim); }

        /* ── Buttons ───────────────────────────────────────────────────────── */
        button {
            cursor: pointer;
            border: none;
            border-radius: 7px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            transition: all 0.15s ease;
            outline: none;
            letter-spacing: 0.5px;
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-primary {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid var(--cyan-dim);
            color: var(--cyan);
        }
        .btn-primary:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.25);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
        }

        .btn-success {
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid #00663a;
            color: var(--green);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(0, 255, 136, 0.22);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
        }

        .btn-danger {
            background: rgba(255, 58, 92, 0.12);
            border: 1px solid #7a1a2a;
            color: var(--red);
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(255, 58, 92, 0.22);
            box-shadow: 0 0 12px rgba(255, 58, 92, 0.2);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 100%;
        }
        .btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
        .btn-secondary.active {
            background: rgba(255, 200, 0, 0.18);
            border-color: var(--yellow);
            color: var(--yellow);
        }

        /* ── Fire Button (shooter scenario only) ──────────────────────────── */
        .fire-button {
            position: absolute;
            top: 62%;
            right: 4%;
            transform: translateY(-50%);
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: rgba(255, 58, 92, 0.22);
            border: 2px solid rgba(255, 58, 92, 0.75);
            color: transparent;
            font-size: 0;
            z-index: 60;
            opacity: 1;
            transition: opacity 0.2s, background 0.15s;
        }
        .fire-button:active {
            background: rgba(255, 58, 92, 0.55);
            box-shadow: 0 0 24px rgba(255, 58, 92, 0.7);
            opacity: 1;
        }

        /* ── Joystick zones ────────────────────────────────────────────────── */
        .joy-zone {
            position: absolute;
            bottom: 0;
            width: 42%;
            height: 45%;
            touch-action: none;
            user-select: none;
            z-index: 40;
            opacity: 0.65;
            transition: opacity 0.2s ease;
        }
        .joy-zone.joy-active { opacity: 1; }
        .joy-zone-left  { left: 0; }
        .joy-zone-right { right: 0; }

        /* Restilizado de los círculos generados por nipplejs (clases .back / .front) */
        .joy-zone .back {
            background: rgba(7, 8, 15, 0.45) !important;
            border: 2px solid rgba(0, 212, 255, 0.9);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4), inset 0 0 14px rgba(0, 212, 255, 0.2);
        }
        .joy-zone .front {
            background: rgba(0, 212, 255, 1) !important;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.9);
        }
        body.joy-green .joy-zone .back {
            border-color: rgba(13, 255, 20, 0.9) !important;
            box-shadow: 0 0 20px rgba(13, 255, 20, 0.4), inset 0 0 14px rgba(13, 255, 20, 0.2) !important;
        }
        body.joy-green .joy-zone .front {
            background: rgba(13, 255, 20, 1) !important;
            box-shadow: 0 0 16px rgba(13, 255, 20, 0.9) !important;
        }

        /* Sliders de sensibilidad */
        .sensitivity-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sensitivity-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-dim);
        }
        .sensitivity-row label { width: 60px; flex-shrink: 0; line-height: 1.4; }
        .sensitivity-row input[type=range] {
            flex: 1;
            accent-color: var(--cyan);
            height: 4px;
            cursor: pointer;
        }
        .sensitivity-row .pct {
            width: 36px;
            text-align: right;
            color: var(--cyan);
            font-size: 11px;
            flex-shrink: 0;
        }

        /* Selector de color de joysticks */
        .joy-color-selector {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .joy-color-selector > span { font-size: 10px !important; }
        .joy-color-btn {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            cursor: pointer;
            padding: 0;
            transition: border-color 0.15s;
        }
        .joy-color-btn.active { border-color: var(--text); }
        .joy-color-btn.cyan   { background: rgba(0, 212, 255, 0.8); }
        .joy-color-btn.green  { background: rgba(13, 255, 20, 0.8); }

        /* Controles shooter: arma y objetivo */
        .shooter-controls {
            position: absolute;
            top: 8vh;
            left: calc(100% - 124px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 60;
        }
        .shooter-btn {
            background: rgba(0,0,0,0.08);
            border: 1.5px solid rgba(13, 255, 20, 0.35);
            color: rgba(13, 255, 20, 0.9);
            font-size: 18px;
            line-height: 1;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            opacity: 1;
            transition: opacity 0.2s;
        }
        .shooter-btn:active { opacity: 1; background: rgba(13, 255, 20, 0.18); }

        body.gameplay-controls-hidden .joy-zone,
        body.gameplay-controls-hidden .fire-button {
            display: none !important;
        }

        /* Joysticks/disparo ocultos hasta que llega vídeo (HUD visible):
           antes de eso no hay nada que controlar. */
        body.game-not-started .joy-zone,
        body.game-not-started .fire-button {
            display: none !important;
        }
        body.gameplay-controls-hidden #btn-throttle-lock,
        body.gameplay-controls-hidden .joy-color-selector,
        body.gameplay-controls-hidden #hand-selector,
        body.gameplay-controls-hidden .sensitivity-group {
            display: none !important;
        }

        /* Botón disparo: zurdo → lado izquierdo */
        body.lefty .fire-button {
            right: auto;
            left: 4%;
        }

        /* ── Mode Selection Modal ──────────────────────────────────────────── */
        .modal {
            position: fixed;
            inset: 0;
            /* Degradado vertical (de arriba a abajo, no en diagonal), con
               contraste moderado — visible pero sin ser tan marcado. */
            background: linear-gradient(180deg, #0b2231 0%, #090f1c 55%, #04050b 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal.hidden { display: none; }

        .modal-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 320px;
            max-width: 90vw;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-card h2 {
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--cyan);
            text-align: center;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        select.cam-select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            padding: 7px 10px;
            outline: none;
            cursor: pointer;
        }
        select.cam-select:focus { border-color: var(--cyan-dim); }
        select.cam-select option { background: var(--surface2); }

        #mode-status {
            font-size: 12px;
            color: var(--text-dim);
            text-align: center;
            min-height: 16px;
        }
        #mode-status.error { color: var(--red); }

        .hidden { display: none !important; }

        /* ── Toast ─────────────────────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.25s ease;
            z-index: 2000;
            white-space: nowrap;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.toast-success { border-color: #00663a; color: var(--green); }
        .toast.toast-error   { border-color: #7a1a2a; color: var(--red);   }
        .toast.toast-warning { border-color: #665100; color: var(--yellow); }
        .toast.toast-info    { border-color: var(--cyan-dim); color: var(--cyan); }
    </style>
</head>
<body class="joy-green game-not-started">

<!-- ── Mode Selection Modal ───────────────────────────────────────────────── -->
<div id="mode-modal" class="modal">
    <div class="modal-card">
        <h2>Selecciona modo de control</h2>
        <button id="btn-mode-sitl" class="btn-primary">SITL (Simulación)</button>
        <button id="btn-mode-real" class="btn-secondary">Dron físico</button>

        <div id="real-drone-options" class="hidden" style="display:flex; flex-direction:column; gap:10px;">
            <select id="serial-port-select" class="cam-select">
                <option value="">Seleccionar puerto...</option>
            </select>
            <button id="btn-connect-real" class="btn-success">Conectar</button>
        </div>

        <div id="mode-status"></div>
    </div>
</div>

<!-- ── Main UI (fullscreen video + controls) ─────────────────────────────── -->
<div id="main-ui" class="hidden">
    <section class="video-panel">
        <video id="video-feed" autoplay playsinline muted></video>
        <div id="no-signal" class="no-signal">
            <svg class="no-signal-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="12" width="48" height="32" rx="3" stroke="currentColor" stroke-width="2"/>
                <path d="M24 44l-4 8M40 44l4 8M20 52h24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M16 20l8 8m0-8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M32 24v8M32 36v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <p>SIN SEÑAL DE VIDEO</p>
            <p style="font-size:11px">Esperando stream de Unity...</p>
        </div>

        <!-- Joysticks -->
        <div id="joy-left" class="joy-zone joy-zone-left"></div>
        <div id="joy-right" class="joy-zone joy-zone-right"></div>

        <!-- Fire button (solo escenario shooter) -->
        <button id="btn-fire" class="fire-button hidden"></button>

        <!-- Controles shooter: arma y objetivo (solo shooter) -->
        <div id="shooter-controls" class="shooter-controls hidden">
            <button id="btn-cycle-weapon" class="shooter-btn">
                <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                    <path d="M12 4a8 8 0 0 0-6.627 3.535L7 9H2V4l1.88 1.88A9.959 9.959 0 0 1 12 2c2.392 0 4.608.84 6.355 2.232L16.9 5.686A7.963 7.963 0 0 0 12 4z"/>
                    <path d="M12 20a8 8 0 0 0 6.627-3.535L17 15h5v5l-1.88-1.88A9.959 9.959 0 0 1 12 22c-2.392 0-4.608-.84-6.355-2.232L7.1 18.314A7.963 7.963 0 0 0 12 20z"/>
                </svg>
            </button>
            <button id="btn-cycle-target" class="shooter-btn missile-only hidden">▲</button>
        </div>
    </section>

    <!-- Botón para abrir el panel lateral de controles -->
    <button id="btn-drawer-toggle" class="drawer-toggle-btn" aria-label="Configuración">☰</button>

    <!-- Botón para entrar/salir de pantalla completa -->
    <button id="btn-fullscreen-toggle" class="drawer-toggle-btn fullscreen-toggle-btn" aria-label="Pantalla completa">
        <svg id="icon-fullscreen-enter" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
            <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
        <svg id="icon-fullscreen-exit" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
            <path d="M9 3v3a2 2 0 0 1-2 2H4"/>
            <path d="M15 3v3a2 2 0 0 0 2 2h3"/>
            <path d="M4 15h3a2 2 0 0 1 2 2v3"/>
            <path d="M20 15h-3a2 2 0 0 0-2 2v3"/>
        </svg>
    </button>

    <!-- Panel lateral deslizante -->
    <div id="drawer-overlay" class="drawer-overlay hidden"></div>
    <aside id="side-drawer" class="side-drawer">
        <div class="drawer-header">
            <span>CONFIGURACIÓN</span>
            <button id="btn-drawer-close" class="drawer-close-btn" aria-label="Cerrar">✕</button>
        </div>

        <div class="drawer-divider"></div>

        <div class="drawer-section">
            <label class="drawer-toggle-row">
                <input type="checkbox" id="toggle-gameplay-controls" checked>
                <span>Joysticks</span>
            </label>
            <div class="joy-color-selector">
                <span style="font-size:12px;color:var(--text-dim)">Color:</span>
                <button id="joy-color-cyan"  class="joy-color-btn cyan"          title="Cyan"></button>
                <button id="joy-color-green" class="joy-color-btn green active" title="Verde"></button>
            </div>
            <div class="joy-color-selector" id="hand-selector">
                <span style="font-size:12px;color:var(--text-dim)">Mano:</span>
                <button id="hand-right" class="joy-color-btn active" style="width:auto;height:auto;padding:2px 6px;border-radius:4px;font-size:10px;color:var(--text);background:rgba(255,255,255,0.08);">DIESTRO</button>
                <button id="hand-left"  class="joy-color-btn"        style="width:auto;height:auto;padding:2px 6px;border-radius:4px;font-size:10px;color:var(--text);background:rgba(255,255,255,0.08);">ZURDO</button>
            </div>
            <div class="sensitivity-group">
                <div class="sensitivity-row">
                    <label>Izq. X<br><span style="color:var(--text-dim)">(Yaw)</span></label>
                    <input type="range" id="sens-left-x" min="10" max="100" value="50">
                    <span class="pct" id="sens-left-x-val">50%</span>
                </div>
                <div class="sensitivity-row">
                    <label>Izq. Y<br><span style="color:var(--text-dim)">(Empuje)</span></label>
                    <input type="range" id="sens-left-y" min="10" max="100" value="50">
                    <span class="pct" id="sens-left-y-val">50%</span>
                </div>
                <div class="sensitivity-row">
                    <label>Der. X<br><span style="color:var(--text-dim)">(Roll)</span></label>
                    <input type="range" id="sens-right-x" min="10" max="100" value="50">
                    <span class="pct" id="sens-right-x-val">50%</span>
                </div>
                <div class="sensitivity-row">
                    <label>Der. Y<br><span style="color:var(--text-dim)">(Pitch)</span></label>
                    <input type="range" id="sens-right-y" min="10" max="100" value="50">
                    <span class="pct" id="sens-right-y-val">50%</span>
                </div>
            </div>
            <button id="btn-throttle-lock" class="btn-secondary drawer-btn">BLOQUEAR EMPUJE JOYSTICK IZQ.</button>
        </div>

        <div class="drawer-divider"></div>

        <div class="drawer-section">
            <button id="btn-arm" class="btn-primary drawer-btn">ARMAR DRON</button>
            <button id="btn-arm-force" class="btn-secondary drawer-btn">FORZAR ARMADO</button>
            <button id="btn-guided" class="btn-primary drawer-btn">MODO GUIDED</button>
            <button id="btn-loiter" class="btn-primary drawer-btn">MODO LOITER</button>
            <button id="btn-takeoff" class="btn-success drawer-btn">DESPEGAR</button>
            <div class="altitude-control">
                <span>Altura de despegue:</span>
                <input type="number" id="altitude" value="5" min="1" max="50" step="0.5">
                <span>m</span>
            </div>
            <button id="btn-land" class="btn-danger drawer-btn">ATERRIZAR</button>
            <button id="btn-rtl" class="btn-secondary drawer-btn">VOLVER A CASA</button>
        </div>
    </aside>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────────────── -->
<div id="toast" class="toast"></div>

<script src="/static/js/main.js"></script>
</body>
</html>
