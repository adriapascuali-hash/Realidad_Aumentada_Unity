<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Mismo motivo que index.html: el manifest/meta apple-* son la única
         forma real de conseguir cero interfaz del navegador (vía "Añadir a
         pantalla de inicio"); la Fullscreen API del botón de abajo es la
         alternativa de mejor esfuerzo sin ese paso. -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#07080f">
    <title>Drone Control Station — Vista</title>
    <style>
        /* ── Reset & Base ──────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #07080f;
            --border:   #1e2540;
            --text:     #cdd6f4;
            --text-dim: #6c7086;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            width: 100vw;
            touch-action: manipulation;
            overscroll-behavior: none;
            overflow: hidden;
        }
        html { height: 100dvh; }
        body {
            /* Ver index.html: 1px de margen a propósito para poder plegar la
               barra de direcciones móvil vía scrollTo(0,1) en main2.js. */
            min-height: calc(100dvh + 1px);
        }

        /* ── Video Panel (fullscreen) ─────────────────────────────────────── */
        .video-panel {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .no-signal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-dim);
        }

        .no-signal-icon {
            width: 64px;
            height: 64px;
            opacity: 0.3;
        }

        .no-signal p {
            font-size: 13px;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        /* ── Botón de pantalla completa (único control de esta vista) ──────── */
        .fullscreen-toggle-btn {
            position: absolute;
            top: 48px;
            right: 12px;
            z-index: 80;
            padding: 7px 9px;
            border-radius: 5px;
            background: rgba(0,0,0,0.55);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .fullscreen-toggle-btn:hover { background: rgba(0,0,0,0.75); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<section class="video-panel">
    <video id="video-feed" autoplay playsinline muted></video>
    <div id="no-signal" class="no-signal">
        <svg class="no-signal-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="12" width="48" height="32" rx="3" stroke="currentColor" stroke-width="2"/>
            <path d="M24 44l-4 8M40 44l4 8M20 52h24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M16 20l8 8m0-8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M32 24v8M32 36v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p>SIN SEÑAL DE VIDEO</p>
        <p style="font-size:11px">Esperando stream de Unity...</p>
    </div>
</section>

<!-- Botón para entrar/salir de pantalla completa -->
<button id="btn-fullscreen-toggle" class="fullscreen-toggle-btn" aria-label="Pantalla completa">
    <svg id="icon-fullscreen-enter" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
        <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
    <svg id="icon-fullscreen-exit" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
        <path d="M9 3v3a2 2 0 0 1-2 2H4"/>
        <path d="M15 3v3a2 2 0 0 0 2 2h3"/>
        <path d="M4 15h3a2 2 0 0 1 2 2v3"/>
        <path d="M20 15h-3a2 2 0 0 0-2 2v3"/>
    </svg>
</button>

<script src="/static/js/main2.js"></script>
</body>
</html>
